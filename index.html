         ESTE <script> ES TODO LO QUE NECESITA LA PÁGINA. Nada más.
         El ENGINE (include.js) trae el canvas, el loop, el refresco

         al server de desarrollo y en producción al backend del VPS
         (que además manda Access-Control-Allow-Origin: *, así que
         se puede embeber desde cualquier dominio).

         Fuentes posibles (el tipo se detecta solo):
           data-comp="<nombre>"           -> composicion del nodeeditor (+ data-pass)
           data-shader="<nombre>"         -> un shader de la galeria
           data-performance="<sessionId>" -> el output de una sesion de performance
         También sirve ?comp= / ?shader= / ?session= en la URL, o pegás
         el link en el panel con la tecla S.
         ============================================================ -->
